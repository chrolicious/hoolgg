version: '3.8'

services:
  guild-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://hool:hool@postgres:5432/hoolgg
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - BLIZZARD_CLIENT_ID=${BLIZZARD_CLIENT_ID}
      - BLIZZARD_CLIENT_SECRET=${BLIZZARD_CLIENT_SECRET}
      - BLIZZARD_REDIRECT_URI=${BLIZZARD_REDIRECT_URI}
      - BLIZZARD_REGION=${BLIZZARD_REGION}
      - FLASK_ENV=development
    networks:
      - hoolgg_default
    restart: unless-stopped

networks:
  hoolgg_default:
    external: true
